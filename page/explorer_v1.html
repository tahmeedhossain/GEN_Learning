<title>University Physics Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,400;7..72,600&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: chapter bar and book arc map on top; three panes below: what you have read (left),
   the chapter's concept graph in model | state | observable columns (centre), the selected concept (right). */
:root {
  --paper: #f4f6f8;
  --panel: #ffffff;
  --ink: #1a2330;
  --muted: #5b6777;
  --rule: #d5dce4;
  --faint: #eaeff3;
  --obs: #a9670d;
  --mod: #5f45bf;
  --sta: #0d746d;
  --and: #2b62c2;
  --or: #bd3279;
  --rel: #378424;
  --qand: #d2461a;
  --qor: #9c7000;
  --fail: #8a94a1;
  --hl: #ffe45c;
  --hl-soft: #fff4b8;
  --accent: #23508e;
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --step-0: 0.75rem;
  --step-1: 0.8125rem;
  --step-2: 0.9375rem;
  --step-3: 1.125rem;
  --step-4: 1.5rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141a; --panel: #161c24; --ink: #e1e7ee; --muted: #9ba6b4; --rule: #2a3440; --faint: #1d252f;
    --obs: #e2a54b; --mod: #a492f3; --sta: #39b8ad;
    --and: #6e9ef2; --or: #ec6dae; --rel: #77c860; --qand: #ff7c4f; --qor: #e1b440; --fail: #6b7583;
    --hl: rgba(255, 220, 60, 0.42); --hl-soft: rgba(255, 220, 60, 0.16); --accent: #91b5f6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141a; --panel: #161c24; --ink: #e1e7ee; --muted: #9ba6b4; --rule: #2a3440; --faint: #1d252f;
  --obs: #e2a54b; --mod: #a492f3; --sta: #39b8ad;
  --and: #6e9ef2; --or: #ec6dae; --rel: #77c860; --qand: #ff7c4f; --qor: #e1b440; --fail: #6b7583;
  --hl: rgba(255, 220, 60, 0.42); --hl-soft: rgba(255, 220, 60, 0.16); --accent: #91b5f6;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: var(--step-1); line-height: 1.45; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-direction: column; min-height: 100%; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- top bar ---------- */
.top { background: var(--panel); border-bottom: 1px solid var(--rule); padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: var(--step-3); margin: 0; letter-spacing: -0.005em; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: var(--step-0); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 6px; padding: 5px 10px; cursor: pointer; line-height: 1.2; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn[disabled] { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
select.btn { padding-right: 6px; max-width: 360px; }
#chapCtl { flex-wrap: nowrap; min-width: 0; }
#chapCtl select { min-width: 0; flex: 1 1 auto; }
@media (max-width: 759px) { #chapCtl { flex: 1 1 100%; } #chapCtl select { max-width: none; } }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg label { position: relative; padding: 5px 9px; cursor: pointer; border-right: 1px solid var(--rule); font-size: var(--step-0); display: flex; align-items: center; }
.seg label:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + span { font-weight: 700; }
.seg label:has(input:checked) { background: var(--faint); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.ctl-label { font-size: var(--step-0); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

/* ---------- book map ---------- */
.mapbar { background: var(--panel); border-bottom: 1px solid var(--rule); padding-block: 4px 2px; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.mapbar svg { display: block; width: 100%; height: 98px; }
.map-tick { cursor: pointer; }
.map-tick rect { fill: var(--faint); stroke: var(--rule); }
.map-tick text { font-size: 9px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.map-tick.cur rect { fill: var(--hl); stroke: var(--ink); }
.map-tick.cur text { fill: var(--ink); font-weight: 700; }
.map-tick.feed rect { fill: var(--hl-soft); stroke: var(--accent); }
.map-tick:focus-visible rect { stroke: var(--accent); stroke-width: 2; }
.arc { fill: none; stroke: var(--muted); opacity: 0.05; }
.arc.in { stroke: var(--accent); opacity: 0.85; }
.vol-label { font-size: 10px; fill: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

/* ---------- three panes ---------- */
.main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; min-height: 0; }
.pane { min-width: 0; min-height: 0; }
.reader, .card { background: var(--panel); }
.reader { border-top: 1px solid var(--rule); }
.card { border-top: 1px solid var(--rule); }
.graph-pane { display: flex; flex-direction: column; }
@media (min-width: 760px) {
  .main { grid-template-columns: minmax(0, 1fr) minmax(280px, 340px); grid-template-areas: "graph card" "graph reader"; }
  .graph-pane { grid-area: graph; border-right: 1px solid var(--rule); }
  .card { grid-area: card; border-top: 0; }
  .reader { grid-area: reader; }
}
@media (min-width: 1180px) {
  html, body { overflow: hidden; }
  .app { height: 100%; }
  .main { grid-template-columns: minmax(250px, 300px) minmax(0, 1fr) minmax(300px, 360px); grid-template-areas: "reader graph card"; }
  .reader { grid-area: reader; border-top: 0; border-right: 1px solid var(--rule); overflow-y: auto; }
  .card { overflow-y: auto; }
  .graph-pane { border-right: 1px solid var(--rule); }
  .graph-scroll { overflow-y: auto; }
}

/* ---------- graph ---------- */
.graph-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 10px 16px 6px; }
.graph-head h2 { font-family: var(--f-display); font-weight: 600; font-size: var(--step-4); margin: 0; line-height: 1.15; text-wrap: balance; }
.eyebrow { font-size: var(--step-0); color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.stepbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 4px 16px 10px; border-bottom: 1px solid var(--rule); }
.stepbar input[type=range] { flex: 1 1 160px; min-width: 120px; accent-color: var(--ink); }
.steptext { font-size: var(--step-0); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; }
.graph-scroll { position: relative; flex: 1; min-height: 0; }
.colheads { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(3px); border-bottom: 1px solid var(--rule); }
.colheads div { padding: 6px 0 5px; font-size: var(--step-0); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.colheads b { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
#graph { display: block; width: 100%; }
.band-rule { stroke: var(--rule); }
.band-title { font-size: 11px; fill: var(--muted); letter-spacing: 0.04em; }
.band-title .num { font-weight: 700; fill: var(--ink); }
.band-bg { fill: var(--faint); }
.col-guide { fill: var(--panel); opacity: 0.55; }
.node { cursor: pointer; }
.node .pill { stroke-width: 1.4; }
.node .lbl { font-size: 11.5px; fill: var(--ink); }
.node .tag { font-size: 9px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.node.past .pill { stroke-dasharray: 4 3; }
.node.trace .pill { stroke-dasharray: 2 3; }
.node.trace { opacity: 0.85; }
.node .glow { fill: var(--hl); opacity: 0; }
.node.fresh .glow { opacity: 1; }
.node:focus-visible .pill { stroke-width: 3; }
.node.sel .pill { stroke-width: 3; }
.route path.edge { fill: none; stroke-width: 1.6; }
.route path.hit { fill: none; stroke: transparent; stroke-width: 10; cursor: pointer; }
.route.failed path.edge { stroke-dasharray: 5 4; }
.route .xmark { font-size: 12px; font-weight: 700; fill: var(--fail); }
.route.fresh path.edge { stroke-width: 2.6; }
.route.sel path.edge { stroke-width: 3; }
svg.dim .node:not(.on) { opacity: 0.34; }
svg.dim .route:not(.on) { opacity: 0.1; }
svg.dim .route.on path.edge { stroke-width: 2.4; }
@media (prefers-reduced-motion: no-preference) {
  .route.fresh path.edge { animation: draw 0.9s ease-out both; stroke-dasharray: 600; }
  .route.fresh.failed path.edge { animation: none; stroke-dasharray: 5 4; }
  @keyframes draw { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
  .node.fresh .glow { animation: glow 1.4s ease-out both; }
  @keyframes glow { from { opacity: 0; } 30% { opacity: 1; } to { opacity: 0.9; } }
}
.empty-note { font-size: 12px; fill: var(--muted); }

/* ---------- key ---------- */
.key { margin: 8px 16px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); }
.key summary { cursor: pointer; padding: 6px 10px; font-size: var(--step-0); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.key-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 18px; padding: 4px 12px 12px; }
.key-item { display: flex; align-items: center; gap: 8px; font-size: var(--step-0); min-width: 0; }
.key-item svg { flex: none; }

/* ---------- reader ---------- */
.reader-in, .card-in { padding: 14px 16px 22px; }
.reader h3, .card h3 { font-family: var(--f-display); font-weight: 600; font-size: var(--step-3); margin: 2px 0 6px; line-height: 1.25; text-wrap: balance; }
.meta { color: var(--muted); font-size: var(--step-0); }
.feeders { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--rule); border-radius: 999px; padding: 2px 8px; font-size: var(--step-0); background: var(--panel); cursor: pointer; max-width: 100%; text-align: left; }
.chip:hover { border-color: var(--muted); }
.chip.active { background: var(--hl-soft); border-color: var(--accent); }
.chip .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.sec { border-top: 1px solid var(--rule); padding: 9px 0 8px; }
.sec-head { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.sec-head .t { font-weight: 700; font-size: var(--step-1); min-width: 0; }
.sec-head .t .num { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }
.sec-head a { font-size: var(--step-0); white-space: nowrap; }
.evs { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ev { display: flex; align-items: center; gap: 7px; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: var(--step-1); line-height: 1.3; }
.ev:hover { background: var(--faint); }
.ev.todo { color: var(--muted); }
.ev.todo .mk { opacity: 0.45; }
.ev.cur { background: var(--hl); color: var(--ink); }
.ev .arrow { color: var(--muted); }
.ev.link { font-size: var(--step-0); }
.sec .none { font-size: var(--step-0); color: var(--muted); margin-top: 4px; }
.terms { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 8px; }
.terms summary { cursor: pointer; font-size: var(--step-0); color: var(--muted); }
.terms ul { margin: 6px 0 0; padding-left: 18px; font-size: var(--step-0); }
.terms li { margin: 2px 0; }

/* ---------- card ---------- */
.type-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill-tag { font-size: var(--step-0); border-radius: 4px; padding: 1px 6px; border: 1px solid var(--rule); text-transform: uppercase; letter-spacing: 0.06em; }
.formula { font-family: var(--f-math); font-size: var(--step-3); line-height: 1.35; margin: 4px 0 8px; overflow-wrap: anywhere; }
.desc { font-size: var(--step-2); line-height: 1.5; margin: 6px 0 10px; max-width: 65ch; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 10px; font-size: var(--step-1); margin: 8px 0 12px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; }
.props { margin: 4px 0 0; padding-left: 18px; }
.props li { margin: 1px 0; }
.math { font-family: var(--f-math); font-size: var(--step-2); }
.block-title { font-size: var(--step-0); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 14px 0 6px; }
.rt { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: var(--panel); }
.rt.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.rt .rt-title { font-weight: 700; font-size: var(--step-1); display: flex; justify-content: space-between; gap: 8px; }
.rt .rt-title .k { font-weight: 400; color: var(--muted); font-size: var(--step-0); white-space: nowrap; }
.rt .rt-f { font-family: var(--f-math); font-size: var(--step-2); margin: 4px 0; overflow-wrap: anywhere; }
.rt .rt-d { font-size: var(--step-1); color: var(--ink); }
.rt .ins { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.uses { display: flex; flex-wrap: wrap; gap: 4px; }
.trace-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 2px; }
.small { font-size: var(--step-0); color: var(--muted); }
.mk { flex: none; }
footer { border-top: 1px solid var(--rule); background: var(--panel); padding-block: 10px 14px; font-size: var(--step-0); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 18px; }
footer p { margin: 0; max-width: 90ch; }
@media (min-width: 1180px) { footer { display: none; } .reader .credit { display: block; } }
.credit { display: none; margin-top: 18px; font-size: var(--step-0); color: var(--muted); border-top: 1px solid var(--rule); padding-top: 10px; }
.credit p { margin: 0 0 6px; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--panel); font-size: var(--step-0); padding: 4px 8px; border-radius: 5px; max-width: 280px; }
.tip .f { font-family: var(--f-math); font-size: var(--step-1); display: block; }
.vec { position: relative; display: inline-block; }
.vec::after { content: "→"; position: absolute; left: 50%; top: -0.5em; transform: translateX(-50%); font-size: 0.62em; line-height: 1; font-style: normal; }
sub, sup { font-size: 0.72em; line-height: 0; }
.chip .ttl { max-width: 17ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chap-link { font-size: var(--step-0); }
</style>

<div class="app">
  <header class="top gutter">
    <div class="brand">
      <h1>University Physics Network</h1>
      <p>OpenStax <i>University Physics</i>, Volumes 1–3, read as a growing network of observables, models and states</p>
    </div>
    <div class="controls" id="chapCtl">
      <button class="btn" id="prevChap" type="button" aria-label="Previous chapter">‹</button>
      <select class="btn" id="chapter" aria-label="Chapter"></select>
      <button class="btn" id="nextChap" type="button" aria-label="Next chapter">›</button>
    </div>
    <div class="controls" role="group" aria-label="Earlier chapters">
      <span class="ctl-label">Earlier chapters</span>
      <div class="seg">
        <label><input type="radio" name="earlier" id="earlier-needed" value="needed" checked><span>As needed</span></label>
        <label><input type="radio" name="earlier" id="earlier-all" value="all"><span>All at once</span></label>
        <label><input type="radio" name="earlier" id="earlier-off" value="off"><span>Hide</span></label>
      </div>
    </div>
  </header>
  <div class="mapbar gutter" aria-label="Book map: arcs show which earlier chapters supply concepts to each chapter">
    <svg id="map" role="img" aria-label="Chapters of the three volumes in reading order"></svg>
  </div>
  <main class="main">
    <section class="pane graph-pane" aria-label="Concept graph">
      <div class="graph-head">
        <div style="min-width:0">
          <div class="eyebrow" id="gEyebrow"></div>
          <h2 id="gTitle"></h2>
        </div>
      </div>
      <div class="stepbar">
        <button class="btn" id="toStart" type="button" aria-label="Chapter start">⏮</button>
        <button class="btn" id="back" type="button">‹ Back</button>
        <button class="btn primary" id="fwd" type="button">Next concept ›</button>
        <button class="btn" id="toEnd" type="button" aria-label="Whole chapter">⏭</button>
        <input type="range" id="step" min="0" max="1" value="1" aria-label="Reading position in the chapter">
        <span class="steptext" id="stepText"></span>
        <label class="small" style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="follow" checked> Card follows reading</label>
      </div>
      <details class="key" id="key">
        <summary>How to read the graph</summary>
        <div class="key-grid" id="keyGrid"></div>
      </details>
      <div class="graph-scroll" id="gscroll">
        <div class="colheads" id="colheads">
          <div><svg class="mk" width="12" height="12" viewBox="-6 -6 12 12"><rect x="-4.5" y="-4.5" width="9" height="9" rx="2" style="fill:var(--mod)"></rect></svg>Models <b id="cM"></b></div>
          <div><svg class="mk" width="12" height="12" viewBox="-6 -6 12 12"><path d="M-5,0 L-2.5,-4.3 L2.5,-4.3 L5,0 L2.5,4.3 L-2.5,4.3 Z" style="fill:var(--sta)"></path></svg>States <b id="cS"></b></div>
          <div><svg class="mk" width="12" height="12" viewBox="-6 -6 12 12"><circle r="4.6" style="fill:var(--obs)"></circle></svg>Observables <b id="cO"></b></div>
        </div>
        <svg id="graph" role="group" aria-label="Concepts of the chapter and the earlier concepts they use"></svg>
      </div>
    </section>
    <aside class="pane card" aria-label="Selected concept"><div class="card-in" id="card"></div></aside>
    <aside class="pane reader" aria-label="Reading order"><div class="reader-in" id="reader"></div></aside>
  </main>
  <footer class="gutter" id="footer"></footer>
</div>
<div class="tip" id="tip" hidden></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const NODES = DATA.nodes, ROUTES = DATA.routes, EVENTS = DATA.events, CHAPTERS = DATA.chapters;
const SVGNS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const byId = new Map(NODES.map(n => [n.id, n]));
const routeById = new Map(ROUTES.map(r => [r.id, r]));
const ckey = (v, c) => v + "." + c;
const chapIdx = new Map(CHAPTERS.map((c, i) => [ckey(c.vol, c.ch), i]));
CHAPTERS.forEach((c, i) => { c.i = i; c.e0 = c.events[0]; c.e1 = c.events[1]; });
NODES.forEach(n => { n.ci = chapIdx.get(ckey(n.vol, n.chapter)); n.t = n.type[0].toUpperCase(); });
ROUTES.forEach(r => { r.ci = chapIdx.get(ckey(r.vol, r.chapter)); });
EVENTS.forEach(e => { e.ci = chapIdx.get(ckey(e.chapter_key[0], e.chapter_key[1])); });
const routesInto = new Map(), routesFrom = new Map();
const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
ROUTES.forEach(r => { push(routesInto, r.target, r); r.inputs.forEach(i => push(routesFrom, i.node, r)); });
const chapNodes = CHAPTERS.map(() => []), chapRoutes = CHAPTERS.map(() => []);
NODES.forEach(n => chapNodes[n.ci].push(n));
ROUTES.forEach(r => chapRoutes[r.ci].push(r));
chapNodes.forEach(a => a.sort((x, y) => x.event - y.event));
const COVER = DATA.coverage || [];
const TYPE = { O: { name: "Observable", v: "--obs", col: 2 }, M: { name: "Model", v: "--mod", col: 0 }, S: { name: "State", v: "--sta", col: 1 } };
const ERA = { classical: "Classical", relativistic: "Relativistic", quantum: "Quantum" };
const TAGNAME = { def: "definition", law: "law", thm: "derivation", read: "read off", approx: "approximation", lim: "limit", gen: "generalisation", meas: "measurement", fail: "failed prediction", analog: "analogy" };

  if (S.sel && S.sel.kind === "node" && S.sel.id !== id) S.trace = 0;
  if (LAST && LAST.vis.nodes.has(id)) { S.sel = { kind: "node", id }; S.home = null; render(); return; }
  goChapter(n.ci, { ev: Math.max(n.event, CHAPTERS[n.ci].e1) });
  S.sel = { kind: "node", id }; render();
}
function goChapter(ci, opts = {}) {
  ci = Math.max(0, Math.min(CHAPTERS.length - 1, ci));
  const c = CHAPTERS[ci];
  S.ci = ci; S.home = null; S.trace = 0;
  S.ev = opts.ev !== undefined ? Math.max(c.e0 - 1, Math.min(c.e1, opts.ev)) : c.e1;
  if (opts.follow) followEvent();
  try { history.replaceState(null, "", `#v${c.vol}c${c.ch}`); } catch (e) {}
  scroller.scrollTop = 0;
}
function followEvent() {
  if (!S.follow) return;
  const e = EVENTS[S.ev];
  if (!e || e.ci !== S.ci) return;
  S.trace = 0;
  S.sel = e.kind === "node" ? { kind: "node", id: e.node } : { kind: "route", id: e.routes[0] };
}
function stepTo(ev) {
  const c = CHAPTERS[S.ci];
  if (ev > c.e1) { if (S.ci < CHAPTERS.length - 1) { goChapter(S.ci + 1, { ev: CHAPTERS[S.ci + 1].e0, follow: true }); } }
  else if (ev < c.e0 - 1) { if (S.ci > 0) { goChapter(S.ci - 1, { ev: CHAPTERS[S.ci - 1].e1 }); } }
  else { S.ev = ev; if (ev === c.e0 - 1 && S.follow) S.sel = null; followEvent(); }
  render(); scrollToFresh();
}
function scrollToFresh() {
  if (!LAST) return;
  const e = EVENTS[S.ev]; if (!e || e.ci !== S.ci || e.kind !== "node") return;
  const p = LAST.L.pos.get(e.node); if (!p) return;
  const box = scroller.getBoundingClientRect(), svgBox = svg.getBoundingClientRect();
  const yAbs = svgBox.top + p.y * (svgBox.height / LAST.L.height);
  if (scroller.scrollHeight > scroller.clientHeight + 4) {
    if (yAbs < box.top + 40 || yAbs > box.bottom - 40) scroller.scrollTop += yAbs - (box.top + box.height / 2);
  }
}

/* ---------------- reader ---------------- */
function renderReader() {
  const c = CHAPTERS[S.ci];
  const feeders = new Map();
  c.carried_in.forEach(x => { const h = byId.get(x.node).ci; feeders.set(h, (feeders.get(h) || 0) + 1); });
  const fChips = [...feeders.entries()].sort((a, b) => a[0] - b[0]).map(([h, k]) => {
    const hc = CHAPTERS[h];
    return `<button class="chip${S.home === h ? " active" : ""}" type="button" data-home="${h}" title="${esc(hc.title)}: ${k} concept${k > 1 ? "s" : ""}" aria-pressed="${S.home === h}">${chapLabel(hc)} <span class="ttl">${esc(hc.title)}</span> <span class="n">${k}</span></button>`;
  }).join("");
  const evs = EVENTS.filter(e => e.ci === S.ci);
  const secs = c.sections.filter(s => !(s.num.endsWith(".0") && !evs.some(e => e.section === s.num))).map(s => {
    const list = evs.filter(e => e.section === s.num).map(e => {
      const st = e.index < S.ev ? "done" : e.index === S.ev ? "cur" : "todo";
      if (e.kind === "node") {
        const n = byId.get(e.node);
        return `<li class="ev ${st}" data-ev="${e.index}" tabindex="0" role="button">${mkSvg(n.t, n.era)}<span>${esc(n.label)}</span></li>`;
      }
      const r = routeById.get(e.routes[0]);
      return `<li class="ev link ${st}" data-ev="${e.index}" tabindex="0" role="button"><span class="arrow">↳</span><span>New link into ${esc(byId.get(r.target).label)}</span></li>`;
    }).join("");
    return `<div class="sec"><div class="sec-head"><span class="t"><span class="num">${s.num.endsWith(".0") ? "" : s.num}</span>${esc(s.title)}</span><a href="${esc(s.url)}" target="_blank" rel="noopener">Read ↗</a></div>${list ? `<ul class="evs">${list}</ul>` : `<div class="none">No new concepts drawn from this section.</div>`}</div>`;
  }).join("");
  const cov = COVER.filter(x => x.vol === c.vol && x.section.split(".")[0] === String(c.ch));
  const nNode = cov.filter(x => x.status === "node").length, nRef = cov.filter(x => x.status === "node by reference").length;
  const notDrawn = cov.filter(x => x.status === "not modelled");
  const refList = cov.filter(x => x.status === "node by reference").map(x => `<li>${esc(x.term)} → ${esc(byId.get(x.node).label)} (${homeTag(byId.get(x.node))})</li>`).join("");
  const ndList = notDrawn.map(x => `<li><b>${esc(x.term)}</b>: ${esc(x.reason)}</li>`).join("");
  $("reader").innerHTML = `
    <div class="eyebrow">${volName(c.vol)} · ${esc(c.unit || "")}</div>
    <h3>Chapter ${c.ch}. ${esc(c.title)}</h3>
    <div class="chap-link"><a href="${esc(c.sections[0].url)}" target="_blank" rel="noopener">Open the chapter in the book ↗</a></div>
    <div class="meta">${c.new_nodes} new concepts · ${c.routes} links · uses ${c.carried_in.length} concepts from ${feeders.size} earlier chapter${feeders.size === 1 ? "" : "s"}</div>
    ${feeders.size ? `<div class="small" style="margin-top:8px">Earlier chapters it draws on (tap to highlight):</div><div class="feeders" aria-label="Earlier chapters this one draws on">${fChips}</div>` : ""}
    ${secs}
    <details class="terms"><summary>Book key terms: ${nNode} drawn here, ${nRef} drawn elsewhere, ${notDrawn.length} not drawn</summary>
      ${refList ? `<div class="small" style="margin-top:6px">Drawn as an existing node</div><ul>${refList}</ul>` : ""}
      ${ndList ? `<div class="small" style="margin-top:6px">Not drawn, with the reason</div><ul>${ndList}</ul>` : ""}
    </details>
    <div class="credit">${creditHTML()}</div>`;
}
function mkSvg(t, era) {
  const fill = `fill:var(${TYPE[t].v})`;
  let shape = t === "O" ? `<circle r="4.6" style="${fill}"></circle>` : t === "M" ? `<rect x="-4.5" y="-4.5" width="9" height="9" rx="2" style="${fill}"></rect>` : `<path d="M-5,0 L-2.5,-4.3 L2.5,-4.3 L5,0 L2.5,4.3 L-2.5,4.3 Z" style="${fill}"></path>`;
  const ring = era && era !== "classical" ? `<circle r="7.2" style="fill:none;stroke-width:1.5;stroke:var(${era === "quantum" ? "--qand" : "--rel"})"></circle>` : "";
  return `<svg class="mk" width="16" height="16" viewBox="-8 -8 16 16" aria-hidden="true">${ring}${shape}</svg>`;
}
$("reader").addEventListener("click", e => {
  const ev = e.target.closest(".ev"), chip = e.target.closest(".chip");
  if (ev) { S.ev = +ev.getAttribute("data-ev"); const E = EVENTS[S.ev]; S.trace = 0; S.home = null; S.sel = E.kind === "node" ? { kind: "node", id: E.node } : { kind: "route", id: E.routes[0] }; render(); scrollToFresh(); }
  else if (chip) { const h = +chip.getAttribute("data-home"); S.home = S.home === h ? null : h; S.trace = 0; if (S.home !== null && S.mode === "off") setMode("needed"); render(); }
});
$("reader").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.closest(".ev")) { e.preventDefault(); e.target.closest(".ev").click(); } });

/* ---------------- card ---------------- */
function nodeChip(id) {
  const n = byId.get(id);
  const here = n.ci === S.ci;
  return `<button class="chip" type="button" data-node="${esc(id)}">${mkSvg(n.t, n.era)}${esc(n.label)}${here ? "" : ` <span class="n">${homeTag(n)}</span>`}</button>`;
}
function routeBlock(r, selected) {
  const tag = r.tags.length ? r.tags.map(t => TAGNAME[t] || t).join(", ") : "derivation";
  return `<div class="rt${selected ? " sel" : ""}" data-route="${r.id}">
    <div class="rt-title"><span>${esc(r.title || "Link")}</span><span class="k">${esc(tag)} · ${secLabel(r.section)}${r.vol !== CHAPTERS[S.ci].vol || r.ci !== S.ci ? " V" + r.vol : ""}</span></div>
    <div class="rt-f">${fmt(r.formula)}</div>
    ${r.description ? `<div class="rt-d">${fmt(r.description)}</div>` : ""}
    <div class="ins">${r.inputs.map(i => nodeChip(i.node)).join("")} <span class="small" style="align-self:center">→</span> ${nodeChip(r.target)}</div>
    ${r.kind !== "classical" ? `<div class="small" style="margin-top:4px">${esc(KINDNAME[r.kind] || r.kind)}${r.logic === "AND" ? " · all inputs needed together" : ""}</div>` : (r.logic === "AND" ? `<div class="small" style="margin-top:4px">All inputs needed together</div>` : "")}
  </div>`;
}
function renderCard() {
  const card = $("card");
  const c = CHAPTERS[S.ci];
  if (!S.sel) {
    card.innerHTML = `<div class="eyebrow">Nothing selected</div><h3>Pick a concept</h3>
      <p class="desc">Click a concept in the graph or in the reading list to see what it is, where the book introduces it, how it is obtained from earlier concepts, and where it is used later.</p>
      <p class="small">This chapter adds ${c.new_nodes} concepts and ${c.routes} links, and draws on ${c.carried_in.length} concepts from earlier chapters.</p>`;
    return;
  }
  if (S.sel.kind === "route") {
    const r = routeById.get(S.sel.id);
    card.innerHTML = `<div class="eyebrow">Link · ${esc(KINDNAME[r.kind] || r.kind)}</div><h3>${esc(r.title || "Link")}</h3>${routeBlock(r, true)}
      <p class="small">A link lists the concepts that are needed together (AND) to obtain its target. Several links into one concept are alternative routes (OR).</p>`;
    return;
  }
  const n = byId.get(S.sel.id);
  const sec = CHAPTERS[n.ci].sections.find(s => s.num === n.section);
  const ins = (routesInto.get(n.id) || []).filter(r => r.event <= Math.max(S.ev, n.event)).sort((a, b) => a.event - b.event);
  const later = (routesInto.get(n.id) || []).filter(r => r.event > Math.max(S.ev, n.event));
  const usedBy = new Map();
  (routesFrom.get(n.id) || []).forEach(r => { if (!usedBy.has(r.target)) usedBy.set(r.target, r); });
  const usedList = [...usedBy.keys()].map(id => byId.get(id)).sort((a, b) => a.event - b.event);
  const ahead = usedList.filter(x => x.event > S.ev).length;
  const era = n.era !== "classical" ? `<span class="pill-tag" style="border-color:var(${n.era === "quantum" ? "--qand" : "--rel"})">${ERA[n.era]}</span>` : "";
  const flags = [n.primitive ? "taken as given (measured)" : "", n.postulate ? "taken as a starting assumption" : ""].filter(Boolean).join("");
  card.innerHTML = `
    <div class="type-row">${mkSvg(n.t, n.era)}<span class="pill-tag" style="border-color:var(${TYPE[n.t].v})">${TYPE[n.t].name}</span>${era}</div>
    <h3>${esc(n.label)}</h3>
    <div class="formula">${fmt(n.symbol)}</div>
    <p class="desc">${fmt(n.description)}</p>
    <dl class="facts">
      <dt>Introduced</dt><dd>${volName(n.vol)}, ${secLabel(n.section)}${n.section.endsWith(".0") ? "" : " " + esc(sec ? sec.title : "")} · <a href="${esc(sec ? sec.url : "#")}" target="_blank" rel="noopener">Read in the book ↗</a></dd>
      ${n.book_terms.length ? `<dt>Book terms</dt><dd>${n.book_terms.map(esc).join("; ")}</dd>` : ""}
      ${n.math_structure ? `<dt>Structure</dt><dd class="math">${fmt(n.math_structure)}</dd>` : ""}
      ${flags ? `<dt>Status</dt><dd>${flags}</dd>` : ""}
    </dl>
    ${n.properties ? `<div class="block-title">Properties</div><ul class="props">${n.properties.map(p => `<li>${fmt(p)}</li>`).join("")}</ul>` : ""}
    <div class="block-title">How it is obtained${ins.length ? ` · ${ins.length} route${ins.length > 1 ? "s" : ""}` : ""}</div>
    ${ins.length ? ins.map(r => routeBlock(r, false)).join("") : `<p class="small">No route leads here: the network takes it as a starting point.</p>`}
    ${later.length ? `<p class="small">${later.length} more route${later.length > 1 ? "s" : ""} into this concept appear${later.length > 1 ? "" : "s"} later in the book.</p>` : ""}
    <div class="trace-row"><span class="small">Show where it comes from</span>
      <div class="seg" role="radiogroup" aria-label="Trace depth">
        ${[[0, "Off"], [1, "1 step"], [2, "2 steps"], [3, "3 steps"], [99, "All"]].map(([v, t]) => `<label><input type="radio" name="trace" id="trace-${v}" value="${v}"${S.trace === v ? " checked" : ""}><span>${t}</span></label>`).join("")}
      </div></div>
    <div class="block-title">Used by${usedList.length ? ` · ${usedList.length} concept${usedList.length > 1 ? "s" : ""}${ahead ? `, ${ahead} later in the book` : ""}` : ""}</div>
    ${usedList.length ? `<div class="uses">${usedList.map(x => nodeChip(x.id)).join("")}</div>` : `<p class="small">Nothing in the book builds on it within this network.</p>`}`;
}
$("card").addEventListener("click", e => {
  const chip = e.target.closest("[data-node]");
  if (chip) { selectNode(chip.getAttribute("data-node")); return; }
});
$("card").addEventListener("change", e => {
  if (e.target.name === "trace") { S.trace = +e.target.value; S.home = null; if (S.trace && S.mode === "off") setMode("needed"); render(); }
});

/* ---------------- book map ---------------- */
const mapSvg = $("map");
const FEEDS = CHAPTERS.map(c => { const f = new Map(); c.carried_in.forEach(x => { const h = byId.get(x.node).ci; f.set(h, (f.get(h) || 0) + 1); }); return f; });
function drawMap() {
  const W = Math.max(300, mapSvg.getBoundingClientRect().width || 800), H = 98, base = 60, pad = 8, volGap = 16;
  mapSvg.setAttribute("viewBox", `0 0 ${W} ${H}`); mapSvg.innerHTML = "";
  const n = CHAPTERS.length, step = (W - 2 * pad - 2 * volGap) / n;
  const X = i => pad + (CHAPTERS[i].vol - 1) * volGap + (i + 0.5) * step;
  const arcs = el("g", {}, mapSvg);
  CHAPTERS.forEach((c, j) => FEEDS[j].forEach((k, i) => {
    const x1 = X(i), x2 = X(j), h = Math.min(base - 6, 5 + (x2 - x1) * 0.3);
    el("path", { class: "arc" + (j === S.ci ? " in" : ""), "data-to": j, d: `M${x1},${base} Q${(x1 + x2) / 2},${base - 2 * h} ${x2},${base}`, "stroke-width": (0.6 + Math.sqrt(k) * 0.75).toFixed(2) }, arcs);
  }));
  const ticks = el("g", {}, mapSvg);
  const tw = Math.max(5, Math.min(18, step - 2));
  CHAPTERS.forEach((c, i) => {
    const cls = ["map-tick"]; if (i === S.ci) cls.push("cur"); if (FEEDS[S.ci].has(i)) cls.push("feed");
    const gT = el("g", { class: cls.join(" "), "data-ci": i, tabindex: 0, role: "button", "aria-label": `${chapLabel(c)}: ${c.title}` }, ticks);
    el("rect", { x: X(i) - tw / 2, y: base, width: tw, height: 10, rx: 2 }, gT);
    if (step >= 13 || c.ch % 5 === 0 || c.ch === 1) { const t = el("text", { x: X(i), y: base + 21, "text-anchor": "middle" }, gT); t.textContent = c.ch; }
    const tl = el("title", {}, gT); tl.textContent = `${chapLabel(c)} ${c.title}${FEEDS[S.ci].has(i) ? ` · supplies ${FEEDS[S.ci].get(i)} concepts to the open chapter` : ""}`;
  });
  [1, 2, 3].forEach(v => {
    const idx = CHAPTERS.map((c, i) => c.vol === v ? i : -1).filter(i => i >= 0);
    const t = el("text", { class: "vol-label", x: X(idx[0]) - tw / 2, y: base + 34 }, mapSvg);
    t.textContent = W < 760 ? "Vol " + v : ["", "Vol 1 · Mechanics, waves, sound", "Vol 2 · Thermodynamics, electricity, magnetism", "Vol 3 · Optics, relativity, quantum physics"][v];
  });
}
mapSvg.addEventListener("click", e => { const t = e.target.closest(".map-tick"); if (t) { goChapter(+t.getAttribute("data-ci")); S.sel = null; render(); } });
mapSvg.addEventListener("keydown", e => { const t = e.target.closest(".map-tick"); if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); t.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
mapSvg.addEventListener("pointerover", e => {
  const t = e.target.closest(".map-tick"); if (!t) return;
  const j = +t.getAttribute("data-ci");
  mapSvg.querySelectorAll(".arc").forEach(a => a.classList.toggle("in", +a.getAttribute("data-to") === j));
});
mapSvg.addEventListener("pointerout", e => { if (e.target.closest(".map-tick")) mapSvg.querySelectorAll(".arc").forEach(a => a.classList.toggle("in", +a.getAttribute("data-to") === S.ci)); });

/* ---------------- key ---------------- */
function keyItem(svgInner, text, w = 46) { return `<div class="key-item"><svg width="${w}" height="20" viewBox="0 0 ${w} 20" aria-hidden="true">${svgInner}</svg><span>${text}</span></div>`; }

/* ---------------- controls ---------------- */
const chapSel = $("chapter");
chapSel.innerHTML = [1, 2, 3].map(v => `<optgroup label="${volName(v)}">${CHAPTERS.filter(c => c.vol === v).map(c => `<option value="${c.i}">${c.ch}. ${esc(c.title)}</option>`).join("")}</optgroup>`).join("");
chapSel.addEventListener("change", () => { goChapter(+chapSel.value); S.sel = null; render(); });
$("prevChap").addEventListener("click", () => { goChapter(S.ci - 1); S.sel = null; render(); });
$("nextChap").addEventListener("click", () => { goChapter(S.ci + 1); S.sel = null; render(); });
$("fwd").addEventListener("click", () => stepTo(S.ev + 1));
$("back").addEventListener("click", () => stepTo(S.ev - 1));
$("toStart").addEventListener("click", () => { S.ev = CHAPTERS[S.ci].e0 - 1; S.sel = null; S.trace = 0; render(); });
$("toEnd").addEventListener("click", () => { S.ev = CHAPTERS[S.ci].e1; render(); });
$("step").addEventListener("input", e => { S.ev = CHAPTERS[S.ci].e0 - 1 + (+e.target.value); followEvent(); render(); });
$("follow").addEventListener("change", e => { S.follow = e.target.checked; save(); });
function setMode(v) { S.mode = v; const r = document.querySelector(`input[name=earlier][value=${v}]`); if (r) r.checked = true; }
document.querySelectorAll("input[name=earlier]").forEach(r => r.addEventListener("change", e => { S.mode = e.target.value; S.home = null; render(); }));
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, select, textarea")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); stepTo(S.ev + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); stepTo(S.ev - 1); }
  else if (e.key === "]") { goChapter(S.ci + 1); S.sel = null; render(); }
  else if (e.key === "[") { goChapter(S.ci - 1); S.sel = null; render(); }
  else if (e.key === "Escape") { S.sel = null; S.trace = 0; S.home = null; render(); }
});

  const st = DATA.stats;
  return `<p>Source: <a href="https://openstax.org/details/books/university-physics-volume-1" target="_blank" rel="noopener"><i>University Physics</i>, Volumes 1–3</a>, by Samuel J. Ling, Jeff Sanny and William Moebs with contributing authors, OpenStax, Rice University, licensed <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>; access for free at <a href="https://openstax.org/books/university-physics-volume-1/pages/1-introduction" target="_blank" rel="noopener">openstax.org</a>. The book fixes the order in which concepts appear and the list of key terms; node and link descriptions were written for this network.</p>
  <p>${st.nodes} concepts, ${st.routes} links. The book's ${st.glossary_terms} key terms: ${st.glossary_node} drawn as nodes, ${st.glossary_node_by_reference} matched to a node of another section, ${st.glossary_not_modelled} not drawn (reasons listed per chapter).</p>
  <p>This network is an adaptation of the book (its order and key terms, with new descriptions and links) and is shared under the same licence, <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>. Prepared with AI assistance (Claude, Anthropic).</p>`;
}
$("footer").innerHTML = creditHTML();
$("key").open = keyOpen;
$("key").addEventListener("toggle", () => { try { localStorage.setItem("upnet-key", $("key").open ? "1" : "0"); } catch (e) {} });

/* ---------------- render ---------------- */
function render() {
  const c = CHAPTERS[S.ci];
  chapSel.value = String(S.ci);
  $("prevChap").disabled = S.ci === 0; $("nextChap").disabled = S.ci === CHAPTERS.length - 1;
  const total = c.e1 - c.e0 + 1, k = S.ev - c.e0 + 1;
  const st = $("step"); st.max = total; st.value = k;
  $("back").disabled = S.ci === 0 && k <= 0;
  $("fwd").disabled = S.ci === CHAPTERS.length - 1 && k >= total;
  const e = EVENTS[S.ev];
  const where = e && e.ci === S.ci ? ` · ${secLabel(e.section)}` : "";
  $("stepText").textContent = k <= 0 ? `Before the first concept of ${total} steps` : `Step ${k} of ${total}${where}`;
  $("gEyebrow").textContent = `${volName(c.vol)} · Chapter ${c.ch}${c.unit ? " · " + c.unit : ""}`;
  $("gTitle").textContent = c.title;
  document.querySelectorAll("input[name=earlier]").forEach(r => { r.checked = r.value === S.mode; });
  $("follow").checked = S.follow;
  if (S.sel && S.sel.kind === "node" && !byId.has(S.sel.id)) S.sel = null;
  const vis = visible();
  drawGraph(vis);
  renderReader();
  renderCard();
  drawMap();
  save();
}
window.addEventListener("hashchange", () => {
  const h = /^#v([123])c(\d{1,2})$/.exec(location.hash || "");
  if (h && chapIdx.has(ckey(+h[1], +h[2]))) { goChapter(chapIdx.get(ckey(+h[1], +h[2]))); S.sel = null; render(); }
});
let rT = null;
window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { layoutCache.clear(); render(); }, 120); });
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutCache.clear(); render(); });
})();
</script>
